# 실습 7 — 첫 Pod. 세 프로브와 Downward API 를 한 장에 담았다.
# Pod 를 직접 만드는 것은 실습용이다. 운영에서는 Deployment 를 쓴다(8장).
apiVersion: v1
kind: Pod
metadata:
  name: shop-__ME__
  labels: { app: shop-__ME__, owner: __ME__ }
spec:
  # 이 클러스터의 훈련생 노드는 taint 가 없다. 플랫폼 노드에는 못 뜬다(A02).
  terminationGracePeriodSeconds: 40
  containers:
    - name: app
      image: __REG__/shop-__ME__:__TAG__
      imagePullPolicy: IfNotPresent
      ports:
        - { name: http, containerPort: 8080 }
        - { name: mgmt, containerPort: 8081 }   # 관리 포트는 따로 (13장)

      env:
        # 7장 Downward API — 앱이 자기 이름을 알게 된다.
        # A04 에서 이 값이 Prometheus 지표의 태그로 나타나는 것을 확인한다.
        - { name: POD_NAME,  valueFrom: { fieldRef: { fieldPath: metadata.name } } }
        - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
        - { name: POD_IP,    valueFrom: { fieldRef: { fieldPath: status.podIP } } }
        - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75" }

      resources:
        requests: { cpu: 200m, memory: 512Mi }
        limits:   { cpu: "1",  memory: 1Gi }

      # 세 프로브. 역할이 각각 다르다 — 같은 경로를 쓰면 안 되는 이유가 여기 있다.
      startupProbe:                       # 느린 기동을 봐 준다 (최대 150초)
        httpGet: { path: /actuator/health/liveness, port: mgmt }
        periodSeconds: 5
        failureThreshold: 30
      livenessProbe:                      # 실패하면 재시작 — 가볍게 유지
        httpGet: { path: /actuator/health/liveness, port: mgmt }
        periodSeconds: 10
        timeoutSeconds: 3
      readinessProbe:                     # 실패하면 트래픽만 끊는다
        httpGet: { path: /actuator/health/readiness, port: mgmt }
        periodSeconds: 5
        timeoutSeconds: 3

  imagePullSecrets:
    - name: harbor-cred                   # Harbor 프로젝트가 private 이다
