# 실습 15 — EFS(efs-sc) 는 ReadWriteMany 다. 같은 볼륨에 여러 Pod 가 동시에 붙는다.
#        실습 14 과 비교하면 다른 것은 accessModes 와 storageClassName 두 줄뿐이다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-__ME__
spec:
  accessModes: [ReadWriteMany]        # ★ RWX
  storageClassName: efs-sc            # ★ EFS
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-__ME__
  labels: { app: shared-__ME__, owner: __ME__ }
spec:
  replicas: 1                          # 실습 중 3으로 올린다
  selector:
    matchLabels: { app: shared-__ME__ }
  template:
    metadata:
      labels: { app: shared-__ME__, owner: __ME__ }
    spec:
      containers:
        - name: app
          image: registry.k8s.io/busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: shared, mountPath: /shared }
      volumes:
        - name: shared
          persistentVolumeClaim: { claimName: shared-__ME__ }
