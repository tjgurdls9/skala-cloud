# 실습 14 — EBS(ebs-sc) 는 ReadWriteOnce 다. replicas 를 2로 올리면 두 번째가 Pending 이 된다.
#        그 실패를 보는 것이 이 실습의 목적이다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-__ME__
spec:
  accessModes: [ReadWriteOnce]        # EBS 는 이것뿐이다
  storageClassName: ebs-sc            # 이 클러스터의 기본 SC (gp3, 확장 가능)
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-data-__ME__
  labels: { app: shop-data-__ME__, owner: __ME__ }
spec:
  replicas: 1
  # PVC 를 쓰는 Deployment 는 Recreate 여야 한다.
  # RollingUpdate 면 새 Pod 가 볼륨을 못 붙여 배포가 교착된다.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: shop-data-__ME__ }
  template:
    metadata:
      labels: { app: shop-data-__ME__, owner: __ME__ }
    spec:
      containers:
        - name: app
          image: registry.k8s.io/busybox:1.36
          command: ["sh", "-c", "while true; do date >> /data/log.txt; sleep 10; done"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: data-__ME__ }
