# 5장 — 세 프로브를 붙인 Pod.
# 확인: kubectl get pod shop-api-probes -w   → READY 가 0/1 에서 1/1 로 바뀐다
# 실험: curl -X POST <pod>:8080/api/unready?ready=false 후 READY 열을 본다
apiVersion: v1
kind: Pod
metadata:
  name: shop-api-probes
  labels: { app: shop-api-probes }
spec:
  containers:
    - name: app
      image: shop-api:1.0.0
      ports:
        - { name: http, containerPort: 8080 }
        - { name: mgmt, containerPort: 8081 }
      # 기동 유예 — 최대 5 × 30 = 150초. 준비되면 즉시 다음으로 넘어간다
      startupProbe:
        httpGet: { path: /actuator/health/liveness, port: mgmt }
        periodSeconds: 5
        failureThreshold: 30
      # 프로세스가 살아 있는가 — DB 를 확인하지 않는다(재시작 폭풍 방지)
      livenessProbe:
        httpGet: { path: /actuator/health/liveness, port: mgmt }
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      # 트래픽을 받아도 되는가 — 의존성까지 확인한다
      readinessProbe:
        httpGet: { path: /actuator/health/readiness, port: mgmt }
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
