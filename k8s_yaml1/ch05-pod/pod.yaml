# 5장 — Pod 하나를 직접 만들어 본다.
# 실무에서는 Pod 를 직접 만들지 않는다(네이키드 Pod). 여기서는 구조를 보기 위한 것이다.
#   kubectl apply -f k8s/ch05-pod/
#   kubectl delete pod shop-api-manual   → 되살아나지 않는다 (관리자가 없으므로)
apiVersion: v1
kind: Pod
metadata:
  name: shop-api-manual
  labels:
    app: shop-api-manual
spec:
  containers:
    - name: app
      image: shop-api:1.0.0          # ECR 주소로 바꿔서 쓴다
      ports:
        - { name: http, containerPort: 8080 }
        - { name: mgmt, containerPort: 8081 }
      env:
        # Downward API — Pod 가 자기 정보를 안다 (5장 보강 슬라이드)
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_IP
          valueFrom: { fieldRef: { fieldPath: status.podIP } }
      resources:
        requests: { cpu: 200m, memory: 512Mi }
        limits:   { cpu: "1",  memory: 1Gi }
  restartPolicy: Always
